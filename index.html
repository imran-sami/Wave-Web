<script>
const $=id=>document.getElementById(id),v=$("v"),dlg=$("dlg");

v.preservesPitch=true;
try{pls=JSON.parse(localStorage.getItem("wave_pl")||"[]")}catch(e){}
try{Object.assign(set,JSON.parse(localStorage.getItem("wave_set")||"{}"))}catch(e){}
const savePl=()=>{try{localStorage.setItem("wave_pl",JSON.stringify(pls))}catch(e){}};
const saveSet=()=>{try{localStorage.setItem("wave_set",JSON.stringify(set))}catch(e){}};
const BK_MAGIC="WAVEBK01",bkDate=()=>{try{return+localStorage.getItem("wave_bk")||0}catch(e){return 0}},bkAgo=()=>{const t=bkDate();return t?"Last backup: "+new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"No backup yet"};
const lum=h=>{const n=parseInt(h.slice(1,7),16),f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)},onc=h=>lum(h)>.4?"#111":"#fff";

/* ---------- tap ripple: a little wave from your finger ---------- */
addEventListener("pointerdown",e=>{
 if(document.documentElement.dataset.fx=="off"||e.button>0)return;
 const el=e.target.closest&&e.target.closest(".tile,.pc,.srow,.opt,.ab,.chip,.pb,.pp,.drw .it,.trr,.cpk,.mp,.ib,dialog .row,.rw");
 if(!el||el.disabled)return;
 const r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,d=2*Math.hypot(Math.max(x,r.width-x),Math.max(y,r.height-y));
 ["rip","rip r2"].forEach(c=>{const n=document.createElement("span");n.className=c;n.style.cssText="width:"+d+"px;height:"+d+"px;left:"+(x-d/2)+"px;top:"+(y-d/2)+"px";el.appendChild(n);setTimeout(()=>n.remove(),900)});
},{passive:true});
const MO=[["waves","Waves"],["bubbles","Bubbles"],["aurora","Aurora"],["shimmer","Shimmer"],["pulse","Glow pulse"],["ripples","Ripples"],["sparkles","Sparkles"],["snow","Snowfall"],["flow","Flow"],["neon","Neon ring"],["eq","Equalizer"],["scan","Scanner"]];
const moName=()=>set.fx===0?"None":(MO.find(m=>m[0]==(set.mo||"waves"))||MO[0])[1];
let pgBack=null;
function motionPage(){
  const y=$("pgp").scrollTop,cur=set.fx===0?"none":(set.mo||"waves");
  openPage("Motion style",'<div class="aip" style="padding-top:2px"><span>Pick how buttons and cards move across the whole app. Each box below is a live preview.</span></div><div class="mgrid">'
   +MO.concat([["none","None"]]).map(m=>'<button class="mp'+(cur==m[0]?" on":"")+'" data-m="'+m[0]+'">'+(cur==m[0]?'<span class="rd">'+ic("check",14)+'</span>':"")+m[1]+'</button>').join("")+'</div>',null);
  pgBack=themePage;$("pgp").scrollTop=y;
  $("pgb").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;const m=b.dataset.m;if(m=="none")set.fx=0;else{set.fx=1;set.mo=m}saveSet();applyTheme();motionPage();drawSet()};
}
function applyTheme(){
 const r=document.documentElement,dk=matchMedia("(prefers-color-scheme:dark)").matches;
 r.dataset.theme=set.theme=="system"?(dk?"dark":"light"):set.theme;r.style.setProperty("--ac",set.acc);r.style.setProperty("--on",onc(set.acc));r.dataset.fx=set.fx===0?"off":"on";r.dataset.mo=set.mo||"waves";
 const m=document.querySelector("meta[name=theme-color]");if(m)m.content=getComputedStyle(r).getPropertyValue("--bg").trim();
  if(typeof syncIcons=="function")syncIcons();
}
try{matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>set.theme=="system"&&applyTheme())}catch(e){}

/* ---------- back navigation: every overlay / deep screen is a "layer" ---------- */
const layers=[];let sent=0,skip=0,later=0;

/* ---------- media compatibility helpers ---------- */
const EXT_MIME={mp3:"audio/mpeg",m4a:"audio/mp4",aac:"audio/aac",wav:"audio/wav",flac:"audio/flac",ogg:"audio/ogg",mp4:"video/mp4",webm:"video/webm",mkv:"video/x-matroska"};
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=="MacIntel"&&navigator.maxTouchPoints>1);
/* some phones hand over files with an empty or wrong type (common for m4a/mp4); the player needs a correct one */
function fixBlob(f){
 const ext=(f.name.match(/\.([^.]+)$/)||[])[1],m=ext&&EXT_MIME[ext.toLowerCase()];
 if(!m)return f;
 const ok=f.type&&/^(audio|video)\//.test(f.type)&&f.type!="application/octet-stream"&&!(ext.toLowerCase()=="m4a"&&f.type=="audio/x-m4a")&&!(ext.toLowerCase()=="mp3"&&f.type=="audio/mp3");
 return ok?f:f.slice(0,f.size,m);
}

const okFile=f=>/^(audio|video)\//.test(f.type)||/\.(mp3|m4a|mp4|mkv|webm|flac|wav|ogg|aac)$/i.test(f.name);
function meta(f,isV){return new Promise(r=>{
 const m=document.createElement("video"),u=URL.createObjectURL(f);let done=0;
 const fin=(d,th)=>{if(done)return;done=1;URL.revokeObjectURL(u);m.removeAttribute("src");r({dur:d||0,thumb:th})};
 m.preload="metadata";m.muted=true;m.playsInline=true;
 m.onloadedmetadata=()=>{if(!isV)return fin(m.duration);try{m.currentTime=Math.min(1,(m.duration||2)/4)}catch(e){fin(m.duration)}};
 m.onseeked=()=>{try{const c=document.createElement("canvas");c.width=320;c.height=180;const x=c.getContext("2d"),s=Math.max(320/m.videoWidth,180/m.videoHeight);x.drawImage(m,(320-m.videoWidth*s)/2,(180-m.videoHeight*s)/2,m.videoWidth*s,m.videoHeight*s);fin(m.duration,c.toDataURL("image/jpeg",.7))}catch(e){fin(m.duration)}};
 m.onerror=()=>fin(0);m.src=u;setTimeout(()=>fin(m.duration),3000);
})}
let adding=false;
async function addFiles(files){
 files=[...files].filter(okFile).sort(nat);if(!files.length)return toast("Only mp3, m4a and mp4 files are supported");
 if(adding)return toast("Please wait, still adding files");
 adding=true;let n=0,full=0,dup=0;keepStorage();const dbOk=!!(await open),have=new Set(tracks.concat(trash).map(x=>x.key).filter(Boolean));
 try{
  for(const f of files){
   const key=f.name+"|"+f.size;if(have.has(key)){dup++;continue}have.add(key);
   toast("Adding "+(n+1)+" of "+files.length+"…");
   const isV=f.type.startsWith("video")||/\.(mp4|mkv|webm)$/i.test(f.name),m=await meta(f,isV),now=Date.now();
   const t={id:now.toString(36)+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.[^.]+$/,"").replace(/[_]+/g," "),type:isV?"video":"audio",dur:m.dur,thumb:m.thumb,key:key,blob:fixBlob(f),fav:false,added:now,ord:now};
   tracks.push(t);if(dbOk&&await put(t)==null){tracks.pop();full=1;break}n++;
  }
 }finally{adding=false}
 if(tab=="songs"&&!view&&files.every(f=>/\.(mp4|mkv|webm)$/i.test(f.name)))setTab("videos");
 render();toast(full?"Storage is full. Added "+n+" of "+files.length+". Free up space on your device and try again.":n+(n==1?" file added":" files added")+(dup?" ("+dup+" already in Wave)":""));
}

async function walk(d,out){for await(const[n,h]of d.entries()){if(h.kind=="file"){if(okFile({name:n,type:""}))out.push(h)}else await walk(h,out)}}
async function importDir(d){
 try{
  if(d.queryPermission&&(await d.queryPermission({mode:"read"}))!="granted"&&(await d.requestPermission({mode:"read"}))!="granted")return toast("Permission was not given");
  toast("Reading folder\u2026");const hs=[],fs=[];await walk(d,hs);
  for(const h of hs){try{fs.push(await h.getFile())}catch(e){}}
  await addFiles(fs);

}

let trash=[];const DAY=864e5,KEEP=30*DAY;
const trashN=()=>{const e=$("trn");if(e)e.textContent=trash.length||""};
function removeTracks(ids){
 const now=Date.now();
 ids.forEach(id=>{const t=tracks.find(x=>x.id==id);if(!t)return;t.trashed=now;t.fromPl=pls.filter(p=>p.ids.includes(id)).map(p=>p.id);trash.push(t);put(t)});
 tracks=tracks.filter(x=>!ids.includes(x.id));pls.forEach(p=>p.ids=p.ids.filter(i=>!ids.includes(i)));savePl();trashN();
 if(cur&&ids.includes(cur.id)){v.pause();v.removeAttribute("src");cur=null;closeTo("full");ui()}
 toast(ids.length==1?"Moved to Trash. Kept for 30 days.":ids.length+" items moved to Trash. Kept for 30 days.");
}
function restoreT(ids){
 ids.forEach(id=>{const t=trash.find(x=>x.id==id);if(!t)return;(t.fromPl||[]).forEach(pid=>{const p=pls.find(x=>x.id==pid);if(p&&!p.ids.includes(id))p.ids.push(id)});delete t.trashed;delete t.fromPl;tracks.push(t);put(t)});
 trash=trash.filter(x=>!ids.includes(x.id));tracks.sort((x,y)=>x.added-y.added);savePl();trashN();render();
}
function purgeT(ids){ids.forEach(del);trash=trash.filter(x=>!ids.includes(x.id));trashN()}
function purgeOld(){const o=trash.filter(t=>Date.now()-t.trashed>KEEP);if(o.length){purgeT(o.map(t=>t.id));if($("pgp").classList.contains("open")&&$("pgt").textContent=="Trash")trashPage()}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)purgeOld()});
function trashPage(){
 const y=$("pgp").scrollTop,now=Date.now(),items=[...trash].sort((a,b)=>b.trashed-a.trashed);
 const left=t=>{const d=Math.max(0,Math.ceil((t.trashed+KEEP-now)/DAY));return d==1?"1 day left":d+" days left"};
 let h='<div class="aip" style="padding-top:2px"><span>Deleted songs and videos stay here for 30 days, then they are removed for good. Restore them any time before that, or delete them forever now.</span></div>';
 if(!items.length)h+='<div class="empty"><h3>Trash is empty</h3>Nothing to restore.</div>';
 else h+='<div class="trb"><button class="pb o" data-tr="rall">Restore all</button><button class="pb o red" data-tr="eall" style="color:#e5484d;box-shadow:inset 0 0 0 1.5px #e5484d">Empty trash</button></div>'
  +items.map(t=>'<div class="trr" data-id="'+t.id+'">'+thumb(t,"")+'<div class="tx"><b>'+esc(t.name)+'</b><small class="sub">'+(t.type=="video"?"Video":"Song")+' · '+left(t)+'</small></div><button class="ib" data-tr="r" aria-label="Restore">'+ic("undo",22)+'</button><button class="ib red" data-tr="d" aria-label="Delete forever">'+ic("trash",22)+'</button></div>').join("");
 openPage("Trash",h,null);$("pgp").scrollTop=y;
 $("pgb").onclick=e=>{
  const b=e.target.closest("[data-tr]");if(!b)return;const k=b.dataset.tr,row=b.closest(".trr"),id=row&&row.dataset.id,t=id&&trash.find(x=>x.id==id);
  if(k=="r"&&t){restoreT([id]);toast("Restored")}
  else if(k=="d"&&t){if(!confirm("Delete \u201c"+t.name+"\u201d forever? This cannot be undone."))return;purgeT([id])}
  else if(k=="rall"){restoreT(trash.map(x=>x.id));toast("Everything restored")}
  else if(k=="eall"){if(!confirm("Delete all "+trash.length+" items in Trash forever? This cannot be undone."))return;purgeT(trash.map(x=>x.id))}
  else return;
  trashPage();
 };
}

      const b=t.blob;

async function restoreBackup(f){

    const man=JSON.parse(dec.decode(await f.slice(12,12+ml).arrayBuffer()));
    if(!man||man.app!="wave"||!Array.isArray(man.tracks))return toast("This is not a Wave backup file");
    const when=man.date?new Date(man.date).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"";
    if(!confirm("Restore backup"+(when?" from "+when:"")+"?\n\n"+man.tracks.length+" items and "+(man.pls||[]).length+" playlists will be added. Nothing you already have is deleted."))return;
    if(!(await open))return toast("This browser cannot store the library");
    const have=new Set(tracks.concat(trash).map(x=>x.id));
    let off=12+ml,added=0,failed=0;
    for(let i=0;i<man.tracks.length;i++){
      const m=man.tracks[i],sz=m.__bs||0,start=off;off+=sz;
      if(have.has(m.id))continue;
      const t={};for(const k in m)if(k.slice(0,2)!="__")t[k]=m[k];
      if(sz){const sl=f.slice(start,start+sz,m.__bt||"");t.blob=m.__bn?new File([sl],m.__bn,{type:m.__bt||""}):sl}
      const ok=await put(t);

      added++;toast("Restoring "+(i+1)+" of "+man.tracks.length+"\u2026");
    }
    (man.pls||[]).forEach(p=>{const e=pls.find(x=>x.id==p.id);if(!e)pls.push(p);else p.ids.forEach(id=>{if(!e.ids.includes(id))e.ids.push(id)})});
    savePl();
    if(man.set&&typeof man.set=="object"){Object.assign(set,man.set);saveSet();try{applyTheme();applyViz();sndApply()}catch(e){}}
    if(man.av&&man.av.f){avatar=man.av.f;avthumb=man.av.t;await avSave();renderAv()}
    const a=await dbx("readonly",s=>s.getAll());
    if(a){const all=a.map(t=>(t.ord==null&&(t.ord=t.added),t));trash=all.filter(t=>t.trashed);tracks=all.filter(t=>!t.trashed).sort((x,y)=>x.added-y.added)}

    if($("pgt").textContent=="Backup & restore")backupPage();

  }catch(e){toast("Could not read that backup file")}
}

  for(let k=14;k>=0;k--){const a=orA-k*.07;vx.fillStyle=rgba(ac,(1-k/15)*.9);vx.beginPath();vx.arc(cx+Math.cos(a)*R,cy+Math.sin(a)*R,(5+sm[0]*7)*(1-k/22),0,7);vx.fill()}
  vx.fillStyle=rgba(ac,.5);vx.beginPath();vx.arc(cx,cy,3,0,7);vx.fill();
 }else if(m=="breath"){
  const cx=W/2,cy=H/2;sm[0]=Math.max(en(1,30),(sm[0]||0)*.975);
  const r=W*.15*(1+sm[0]*.4);
  vx.fillStyle=rgba(ac,.1);vx.beginPath();vx.arc(cx,cy,r*1.6,0,7);vx.fill();
  vx.fillStyle=rgba(ac,.2);vx.beginPath();vx.arc(cx,cy,r*1.28,0,7);vx.fill();
  vx.fillStyle=rgba(ac,.92);vx.beginPath();vx.arc(cx,cy,r,0,7);vx.fill();
 }else if(m=="hairline"){
  const N=56,x0=W*.1,gw=W*.8,cy=H/2;vx.lineCap="round";vx.lineWidth=1.8;
  for(let i=0;i<N;i++){const val=bin(i,N);sm[i]=Math.max(val,(sm[i]||0)*.92);const h=2+sm[i]*H*.4,x=x0+i/(N-1)*gw;
   vx.strokeStyle=rgba(ac,.35+.65*sm[i]);vx.beginPath();vx.moveTo(x,cy-h);vx.lineTo(x,cy+h);vx.stroke()}
 }else if(m=="arc"){
  const cx=W/2,cy=H/2,R=W*.27,a0=Math.PI*.75,sw=Math.PI*1.5;
  sm[0]=Math.min(1,Math.max(en(1,60)*1.7,(sm[0]||0)*.97));
  vx.lineCap="round";vx.lineWidth=W*.035;
  vx.strokeStyle=rgba(ac,.15);vx.beginPath();vx.arc(cx,cy,R,a0,a0+sw);vx.stroke();
  vx.strokeStyle=ac;vx.beginPath();vx.arc(cx,cy,R,a0,a0+Math.max(.06,sm[0]*sw));vx.stroke();
 }else if(m=="bloom"){
  const cx=W/2,cy=H/2;sm[0]=Math.max(en(1,30),(sm[0]||0)*.96);
  const L=W*(.15+sm[0]*.1);vx.lineWidth=1.6;
  for(let i=0;i<6;i++){vx.save();vx.translate(cx,cy);vx.rotate(i*Math.PI/3+T*.08);
   vx.strokeStyle=rgba(ac,.55);vx.beginPath();vx.ellipse(L*.55,0,L*.55,L*.22,0,0,7);vx.stroke();vx.restore()}
  vx.fillStyle=ac;vx.beginPath();vx.arc(cx,cy,4+sm[0]*5,0,7);vx.fill();
 }else if(m=="beads"){
  const N=21,x0=W*.1,gw=W*.8,cy=H/2;
  for(let i=0;i<N;i++){const k=td[Math.floor(i/N*td.length*.5)],t=((k-128)/128)*H*.22;sm[i]=(sm[i]||0)*.85+t*.15;
   const e=Math.sin(Math.PI*(i+.5)/N);vx.fillStyle=rgba(ac,.3+.7*e);vx.beginPath();vx.arc(x0+i/(N-1)*gw,cy+sm[i],2.5+e*2,0,7);vx.fill()}
 }else if(m=="tide"){
  sm[0]=Math.max(en(1,60),(sm[0]||0)*.97);const base=H*(.72-sm[0]*.28);
  [[.35,0,.9],[.22,1.6,.6]].forEach(l=>{vx.beginPath();vx.moveTo(0,H);
   for(let x=0;x<=W;x+=6){vx.lineTo(x,base+Math.sin(x/W*Math.PI*2.2+T*l[2]+l[1])*H*.025)}
   vx.lineTo(W,H);vx.closePath();vx.fillStyle=rgba(ac,l[0]);vx.fill()});
 }else if(m=="trace"){
  hc++;if(hc%3==0){hs.push(en(1,60));hs.shift()}
  const lg=vx.createLinearGradient(W*.08,0,W*.92,0);lg.addColorStop(0,rgba(ac,0));lg.addColorStop(.4,rgba(ac,1));lg.addColorStop(1,rgba(ac,1));
  vx.strokeStyle=lg;vx.lineWidth=2.6;vx.lineJoin="round";vx.lineCap="round";vx.beginPath();
  const n=hs.length,y0=H*.58;
  for(let i=0;i<n;i++){const x=W*.08+i/(n-1)*W*.84,y=y0-hs[i]*H*.4;i?vx.lineTo(x,y):vx.moveTo(x,y)}vx.stroke();
  vx.fillStyle=ac;vx.beginPath();vx.arc(W*.92,y0-hs[n-1]*H*.4,4,0,7);vx.fill();
 }else if(m=="eclipse"){
  const cx=W/2,cy=H/2,r=W*.16;sm[0]=Math.max(en(1,30),(sm[0]||0)*.96);const d=W*.04+sm[0]*W*.07;
  [[-d,.9,2.2],[d,.55,1.6]].forEach(c=>{vx.fillStyle=rgba(ac,.07);vx.beginPath();vx.arc(cx+c[0],cy,r,0,7);vx.fill();
   vx.strokeStyle=rgba(ac,c[1]);vx.lineWidth=c[2];vx.beginPath();vx.arc(cx+c[0],cy,r,0,7);vx.stroke()});
 }else if(m=="grid"){
  const bd=[[1,3],[3,6],[6,10],[10,16],[16,24],[24,36],[36,52],[52,76],[76,120]],sp=W*.14,cx=W/2,cy=H/2;
  bd.forEach((b,i)=>{sm[i]=Math.max(en(b[0],b[1]),(sm[i]||0)*.93);
   vx.fillStyle=rgba(ac,.35+.65*sm[i]);vx.beginPath();vx.arc(cx+((i%3)-1)*sp,cy+(Math.floor(i/3)-1)*sp,4+sm[i]*13,0,7);vx.fill()});
 }else if(m=="level"){
  const w=W*.6,h=12,x=(W-w)/2,y=H/2-h/2;sm[0]=Math.min(1,Math.max(en(1,80)*1.6,(sm[0]||0)*.97));
  const rr=(a,b,c,d)=>{vx.beginPath();vx.roundRect?vx.roundRect(a,b,c,d,d/2):vx.rect(a,b,c,d);vx.fill()};
  vx.fillStyle=rgba(ac,.16);rr(x,y,w,h);vx.fillStyle=ac;rr(x,y,Math.max(h,w*sm[0]),h);
 }else if(m=="aura"){
  const cx=W/2,cy=H/2;sm[0]=Math.max(en(1,50),(sm[0]||0)*.97);
  [[Math.cos(T*.2)*W*.12,Math.sin(T*.17)*H*.08,.42],[Math.cos(T*.15+2)*W*.14,Math.sin(T*.21+1)*H*.1,.3]].forEach(b=>{
   const g2=vx.createRadialGradient(cx+b[0],cy+b[1],0,cx+b[0],cy+b[1],W*(.3+sm[0]*.12));
   g2.addColorStop(0,rgba(ac,.14+sm[0]*.4*b[2]*2));g2.addColorStop(1,rgba(ac,0));vx.fillStyle=g2;vx.beginPath();vx.arc(cx+b[0],cy+b[1],W*(.3+sm[0]*.12),0,7);vx.fill()});
 }
 if(clp)vx.restore();
 raf=requestAnimationFrame(vzFrame);
}
function vizSheet(){
 sheet('<h4>Visualization</h4><div class="spg" style="grid-template-columns:repeat(3,1fr)">'+VZ.map(z=>'<button class="spc'+(z[0]==(vzCur())?" on":"")+'" data-z="'+z[0]+'">'+z[1]+'</button>').join("")+'</div>',e=>{
  const b=e.target.closest("[data-z]");if(!b)return;set.viz=b.dataset.z;saveSet();applyViz();closeTo("dlg");
 });
}
$("fvz").onclick=vizSheet;
/* Double-tap left = back 10s, right = forward 10s (keep tapping to keep skipping). Single tap on the middle still changes the visual on music; left/right single taps do nothing. */
(function(){const st=$("stage"),SK=10;let lt=0,side=0,multi=0,acc=0,hid=0,want=0,inBurst=0,pend=0,tgt=0;
const mk=c=>{const e=document.createElement("div");e.className="dtk "+c;e.innerHTML='<span class="rp"></span><div class="pl"><svg viewBox="0 0 34 22"><path d="M5 3l8 8-8 8"/><path d="M15 3l8 8-8 8"/><path d="M25 3l8 8-8 8"/></svg><b></b></div>';st.appendChild(e);return e};
const P={"-1":mk("l"),"1":mk("r")};
const zone=x=>{const r=st.getBoundingClientRect(),p=(x-r.left)/r.width;return p<.4?-1:p>.6?1:0};
const single=()=>{if(cur&&cur.type=="video")return;const i=VZ.findIndex(z=>z[0]==(vzCur()));set.viz=VZ[(i+1)%VZ.length][0];saveSet();applyViz();toast(vzName())};
/* the number on screen updates at once; the real jump is applied once, a moment after the last tap, so fast taps never make the player stutter */
let sk=0;const seekTo=t=>{tgt=t;clearTimeout(sk);sk=setTimeout(()=>{if(v.seeking){pend=1;return}pend=0;try{v.currentTime=tgt}catch(e){}},140)};
v.addEventListener("seeked",()=>{if(pend){pend=0;try{v.currentTime=tgt}catch(e){}}});
const anim=(el,k,o)=>{try{return el.animate(k,o)}catch(e){}};
function jump(z,reset,x,y){if(!cur)return;const d=v.duration;
 if(reset||!inBurst){acc=0;want=v.currentTime}inBurst=1;acc+=SK;
 want=Math.max(0,d&&isFinite(d)?Math.min(want+z*SK,Math.max(0,d-.25)):want+z*SK);seekTo(want);
 const e=P[z],o=P[-z];o.classList.remove("on");e.classList.add("on");
 e.querySelector("b").textContent=acc+" seconds";
 const r=e.getBoundingClientRect(),sz=Math.max(r.width,r.height)*1.6,rp=e.querySelector(".rp");
 rp.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+(x-r.left-sz/2)+"px;top:"+(y-r.top-sz/2)+"px";
 anim(rp,[{transform:"scale(.1)",opacity:.55},{transform:"scale(1)",opacity:0}],{duration:560,easing:"cubic-bezier(.2,.7,.3,1)"});
 const ps=e.querySelectorAll("path");ps.forEach((q,i)=>anim(q,[{opacity:.25},{opacity:1,offset:.45},{opacity:.25}],{duration:480,delay:(z>0?i:2-i)*90,easing:"ease-in-out"}));
 anim(e.querySelector("svg"),[{transform:(z<0?"scaleX(-1) ":"")+"scale(.88)"},{transform:(z<0?"scaleX(-1) ":"")+"scale(1)"}],{duration:220,easing:"cubic-bezier(.2,.9,.3,1.3)"});
 clearTimeout(hid);hid=setTimeout(()=>{e.classList.remove("on");inBurst=0;multi=0},800)}
st.onclick=e=>{const now=Date.now(),z=zone(e.clientX);
 if(z&&multi&&z==side&&now-lt<800){lt=now;jump(z,0,e.clientX,e.clientY);return}
 if(z&&z==side&&now-lt<300){multi=1;lt=now;jump(z,1,e.clientX,e.clientY);return}
 lt=now;side=z;multi=0;
 if(!z)single()}})();
$("v").addEventListener("play",()=>{if(actx&&actx.state=="suspended")actx.resume().catch(()=>{});vzLoop()});

/* ---------- resume last track ---------- */
var lastSv=0;
function saveLast(){if(!cur||Date.now()-lastSv<2000)return;lastSv=Date.now();try{localStorage.setItem("wave_last",JSON.stringify({id:cur.id,t:v.currentTime}))}catch(e){}}
addEventListener("pagehide",()=>{lastSv=0;saveLast()});
function restoreLast(){
 try{
  const l=JSON.parse(localStorage.getItem("wave_last")||"null");if(!l||cur)return;
  const t=tracks.find(x=>x.id==l.id);if(!t)return;
  queue=tracks.filter(x=>x.type==t.type).map(x=>x.id);qi=queue.indexOf(t.id);cur=t;
  if(!t.blob||!t.blob.size)return;if(!t.blob.type||t.blob.type=="application/octet-stream")t.blob=fixBlob(new File([t.blob],t.name+"."+(t.type=="video"?"mp4":"m4a"),{type:t.blob.type}));url=URL.createObjectURL(t.blob);v.src=url;v.preload="metadata";
  v.addEventListener("loadedmetadata",()=>{try{if(l.t&&l.t<v.duration)v.currentTime=l.t}catch(e){}},{once:true});
  ui();ms();
 }catch(e){}
}

applyTheme();renderAv();
dbx("readonly",s=>s.getAll()).then(a=>{const all=(a||[]).map(t=>(t.ord==null&&(t.ord=t.added),t));trash=all.filter(t=>t.trashed);tracks=all.filter(t=>!t.trashed).sort((x,y)=>x.added-y.added);purgeOld();trashN();render();restoreLast()});
render();applyViz();
