*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.th.sq{width:54px;height:54px}.th.wd{width:100px;height:56px;border-radius:10px}
.tx{flex:1;min-width:0}

/* ===== dedicated video player ===== */
#vp{position:fixed;inset:0;z-index:35;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .34s cubic-bezier(.3,.8,.3,1),visibility 0s .34s;overflow:hidden}
#vp.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.3,.8,.3,1)}
#vp.fs{background:#000}
#vp.open.rot{inset:auto;left:0;top:0;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);transition:none}
.vpl{position:relative;flex:none;width:100%;aspect-ratio:var(--va,1.7778);max-height:56vh;max-height:56dvh;background:#000;padding-top:env(safe-area-inset-top,0px);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:#fff}
#vp.fs .vpl{position:absolute;inset:0;max-height:none;aspect-ratio:auto;padding:0}
.vpz{position:absolute;inset:env(safe-area-inset-top,0px) 0 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:1}
#vp.fs .vpz{inset:0}
#vp #v{display:block;position:static;flex:none;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;border-radius:0;background:#000;transform-origin:50% 50%;will-change:transform}
.vbr{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2}
.vsub{position:absolute;left:5%;right:5%;bottom:10px;z-index:3;text-align:center;pointer-events:none;font:600 calc(var(--ss,1)*clamp(15px,4.3vw,26px))/1.32 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;transition:bottom .2s}
#vp.fs .vsub{font-size:calc(var(--ss,1)*clamp(18px,3.4vw,30px));bottom:22px}
.vpl.cs .vsub{bottom:82px}#vp.fs .vpl.cs .vsub{bottom:104px}
.vsub span{unicode-bidi:plaintext;background:rgba(0,0,0,.6);padding:1px 9px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;text-shadow:0 1px 3px #000}
.vspin{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:vsp .8s linear infinite;z-index:4;pointer-events:none}

.vpl .dtk{z-index:6}

.vsb .vth{position:absolute;left:var(--p,0%);top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ac);box-shadow:0 1px 5px rgba(0,0,0,.5);transition:transform .12s}
.vsb.on .vth{transform:scale(1.5)}
.vsb .vbub{position:absolute;bottom:34px;transform:translateX(-50%);padding:5px 9px;border-radius:9px;background:rgba(0,0,0,.78);font:700 13px/1 system-ui,sans-serif;font-style:normal;opacity:0;transition:opacity .12s;white-space:nowrap}
.vsb.on .vbub{opacity:1}
.vrow{display:flex;align-items:center;gap:6px;padding:0 8px}
#vp.fs .vrow{padding:0}
.vpc .vrow .vchp{width:auto;height:34px;border-radius:17px;padding:0 14px;font:700 13.5px/1 system-ui,sans-serif;background:rgba(255,255,255,.15)}
.vul{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:50%;margin-top:-27px;width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.66);color:#fff;display:grid;place-items:center;z-index:8;opacity:0;pointer-events:none;transition:opacity .2s}
.vul.on{opacity:1;pointer-events:auto}
.vpl.lk .vpc{display:none}
.vpi{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 0 calc(24px + env(safe-area-inset-bottom,0px))}
#vp.fs .vpi{display:none}
.vi1{padding:0 18px}
.vi1 h2{margin:0;font-size:20px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.vi1 p{margin:4px 0 0;color:var(--sub);font-size:13.5px}
.vact{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 6px;scrollbar-width:none}
.vact::-webkit-scrollbar{display:none}
.vact button{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:68px;padding:11px 8px 9px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.vact button:active{background:var(--act)}
.vact button.on{color:var(--ac);background:var(--act);border-color:transparent}
.vqr{display:flex;gap:12px;align-items:center;padding:7px 18px;cursor:pointer}
.vqr:active{background:var(--act)}
.vqr .th.wd{width:112px;height:63px;border-radius:10px}
.vqr .tx b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px;line-height:1.3}
.vqr.cur .tx b{color:var(--ac)}

/* mini bar: previous + play + next + close must fit on small phones */
#mini{gap:6px}#mini .ib{width:38px;height:38px}#mini .tx{min-width:0}
/* video player: keep every control inside the picture, even on small screens */
#vp:not(.fs) .vpl{min-height:calc(244px + env(safe-area-inset-top,0px))}
#vp:not(.fs) .vmid #vpp{width:58px;height:58px}#vp:not(.fs) .vmid button{width:46px;height:46px}
#vp:not(.fs) .vmid{gap:clamp(4px,3vw,22px)}
#vp:not(.fs) .vpl.cs .vsub{bottom:92px}
.vrs{bottom:auto;top:64px}
@media (max-height:420px){#vp.fs .vmid button{width:44px;height:44px}#vp.fs .vmid #vpp{width:58px;height:58px}#vp.fs .vtop{padding-bottom:18px}#vp.fs .vbot{padding-top:18px}}

/* every menu opens as its own full window */
dialog{position:fixed;inset:0;width:100%;max-width:none;height:100%;max-height:none;margin:0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));border-radius:0;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
dialog[open]{animation:winIn .26s cubic-bezier(.3,.8,.3,1)}
@keyframes winIn{from{transform:translateX(44px);opacity:0}}
dialog :focus:not(:focus-visible),.sph :focus:not(:focus-visible){outline:none}
.wn{max-width:640px;margin:0 auto}
.wn .sph b{flex:1;min-width:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn .wb{padding:0 8px}
.wn .wb h4{margin:18px 14px 6px}
dialog .row{padding:15px 14px;margin:0}
dialog .row.ic{display:flex;align-items:center;gap:16px}
dialog .row.ic i{display:grid;place-items:center;width:26px;color:var(--sub);flex:none}
dialog .row.ic.red i{color:#e5484d}
.fmh{display:flex;align-items:center;gap:14px;padding:6px 14px 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.fmh .th{flex:none}.fmh .tx{flex:1;min-width:0}.fmh .tx b{white-space:normal;overflow-wrap:anywhere;font-size:17px}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px var(--sh)}
.sbar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:0;border-radius:14px;background:none;color:var(--tx);font:inherit;font-size:12px;cursor:pointer}
.sbar button:active{background:var(--act)}.sbar button:disabled{opacity:.35}.sbar button.red{color:#e5484d}
body.selmode .app{padding-bottom:96px}body.selmode #mini{display:none}
@keyframes pgIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.pgin{animation:pgIn .26s cubic-bezier(.3,.8,.3,1)}
.rw.hold{background:var(--act);transform:scale(.985);transition:transform .15s}
.v-grid .rw.hold,.v-big .rw.hold{outline:2px solid var(--ac)}
</style>
</head>

 const now=Date.now();
 ids.forEach(id=>{const t=tracks.find(x=>x.id==id);if(!t)return;t.trashed=now;t.fromPl=pls.filter(p=>p.ids.includes(id)).map(p=>p.id);trash.push(t);put(t)});

/* ---------- backup & restore ---------- */
async function makeBackup(){
  const all=tracks.concat(trash);
  if(!all.length&&!pls.length)return toast("Nothing to back up yet");
  toast("Preparing backup\u2026");
  try{
    const parts=[],metas=[];
    for(const t of all){
      const m={};for(const k in t)if(k!="blob")m[k]=t[k];
      const b=t.blob;
      if(b&&b.size){m.__bs=b.size;m.__bt=b.type||"";m.__bn=b.name||"";parts.push(b)}else m.__bs=0;
      metas.push(m);
    }
    let last=null;try{last=localStorage.getItem("wave_last")}catch(e){}
    const man={app:"wave",v:1,date:Date.now(),pls:pls,set:set,last:last,av:avatar?{f:avatar,t:avthumb}:null,tracks:metas};
    const mb=new TextEncoder().encode(JSON.stringify(man)),hd=new Uint8Array(12);
    hd.set(new TextEncoder().encode(BK_MAGIC),0);new DataView(hd.buffer).setUint32(8,mb.length);
    const blob=new Blob([hd,mb].concat(parts),{type:"application/octet-stream"});
    const d=new Date(),p=n=>String(n).padStart(2,"0"),name="wave-backup-"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+".wavebackup";
    const u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),120000);
    try{localStorage.setItem("wave_bk",String(Date.now()))}catch(e){}
    drawSet();if($("pgt").textContent=="Backup & restore")backupPage();
    toast("Backup saved: "+name);
  }catch(e){toast("Could not create the backup. Free some space and try again.")}
}
async function restoreBackup(f){
  try{
    const dec=new TextDecoder();
    if(f.size<12||dec.decode(await f.slice(0,8).arrayBuffer())!=BK_MAGIC)return toast("This is not a Wave backup file");
    const ml=new DataView(await f.slice(8,12).arrayBuffer()).getUint32(0);
    const man=JSON.parse(dec.decode(await f.slice(12,12+ml).arrayBuffer()));
    if(!man||man.app!="wave"||!Array.isArray(man.tracks))return toast("This is not a Wave backup file");
    const when=man.date?new Date(man.date).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"";
    if(!(await askC("Restore backup"+(when?" from "+when:"")+"?",man.tracks.length+" items and "+(man.pls||[]).length+" playlists will be added.\nNothing you already have is deleted.","Restore")))return;
    if(!(await open))return toast("This browser cannot store the library");
    const have=new Set(tracks.concat(trash).map(x=>x.id));
    let off=12+ml,added=0,failed=0;
    for(let i=0;i<man.tracks.length;i++){
      const m=man.tracks[i],sz=m.__bs||0,start=off;off+=sz;
      if(have.has(m.id))continue;
      const t={};for(const k in m)if(k.slice(0,2)!="__")t[k]=m[k];
      if(sz){const sl=f.slice(start,start+sz,m.__bt||"");t.blob=m.__bn?new File([sl],m.__bn,{type:m.__bt||""}):sl}
      const ok=await put(t);
      if(ok==null){failed++;if(failed>=3){toast("Stopped: the device ran out of space");break}continue}
      added++;toast("Restoring "+(i+1)+" of "+man.tracks.length+"\u2026");
    }
    (man.pls||[]).forEach(p=>{const e=pls.find(x=>x.id==p.id);if(!e)pls.push(p);else p.ids.forEach(id=>{if(!e.ids.includes(id))e.ids.push(id)})});
    savePl();
    if(man.set&&typeof man.set=="object"){Object.assign(set,man.set);saveSet();try{applyTheme();applyViz();sndApply()}catch(e){}}
    if(man.av&&man.av.f){avatar=man.av.f;avthumb=man.av.t;await avSave();renderAv()}
    const a=await dbx("readonly",s=>s.getAll());
    if(a){const all=a.map(t=>(t.ord==null&&(t.ord=t.added),t));trash=all.filter(t=>t.trashed);tracks=all.filter(t=>!t.trashed).sort((x,y)=>x.added-y.added)}
    trashN();render();drawSet();
    if($("pgt").textContent=="Backup & restore")backupPage();
    toast(failed?"Restored "+added+" items, "+failed+" could not be saved":"Restored. "+added+" new items added");
  }catch(e){toast("Could not read that backup file")}
}

(function(){

  anim(rp,[{transform:"scale(.1)",opacity:.55},{transform:"scale(1)",opacity:0}],{duration:560,easing:"cubic-bezier(.2,.7,.3,1)"});
  e.querySelectorAll("path").forEach((q,i)=>anim(q,[{opacity:.25},{opacity:1,offset:.45},{opacity:.25}],{duration:480,delay:(z>0?i:2-i)*90,easing:"ease-in-out"}));
