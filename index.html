<script type="text/plain" id="wsep">'use strict';
class S extends AudioWorkletProcessor{
constructor(){super();const N=2048,H=512,h=N/2,K=7;this.N=N;this.H=H;this.K=K;this.md='vocal';
this.w=new Float32Array(N);for(let i=0;i<N;i++)this.w[i]=.5-.5*Math.cos(2*Math.PI*i/N);
this.cs=new Float32Array(h);this.sn=new Float32Array(h);for(let i=0;i<h;i++){this.cs[i]=Math.cos(2*Math.PI*i/N);this.sn[i]=-Math.sin(2*Math.PI*i/N)}
this.rv=new Uint16Array(N);let b=0;for(let n=N;n>1;n>>=1)b++;for(let i=0;i<N;i++){let r=0;for(let k=0;k<b;k++)if(i>>k&1)r|=1<<(b-1-k);this.rv[i]=r}
this.rl=new Float32Array(N);this.rr=new Float32Array(N);this.rp=0;this.ac=[new Float32Array(N+H),new Float32Array(N+H)];
this.fo=[new Float32Array(1<<14),new Float32Array(1<<14)];this.fr=0;this.fw=H*3;this.cnt=0;
this.re=new Float32Array(N);this.im=new Float32Array(N);this.yr=new Float32Array(N);this.yi=new Float32Array(N);
this.hist=[];for(let i=0;i<K;i++)this.hist.push(new Float32Array(h+1));this.hp=0;
this.Lr=new Float32Array(h+1);this.Li=new Float32Array(h+1);this.Rr=new Float32Array(h+1);this.Ri=new Float32Array(h+1);this.Cm=new Float32Array(h+1);this.ms=new Float32Array(h+1);
this.tk=new Float32Array(K);this.tf=new Float32Array(13);this.eM=0;this.eS=0;this.fc=0;
this.port.onmessage=e=>{this.md=e.data}}
fft(re,im,inv){const N=this.N,rv=this.rv;for(let i=0;i<N;i++){const j=rv[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
for(let sz=2;sz<=N;sz<<=1){const h=sz>>1,st=N/sz;for(let i=0;i<N;i+=sz)for(let j=0,k=0;j<h;j++,k+=st){const wr=this.cs[k],wi=inv?-this.sn[k]:this.sn[k],a=i+j,b=a+h,xr=re[b]*wr-im[b]*wi,xi=re[b]*wi+im[b]*wr;re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi}}}
med(a,n){for(let i=1;i<n;i++){const v=a[i];let j=i-1;while(j>=0&&a[j]>v){a[j+1]=a[j];j--}a[j+1]=v}return a[n>>1]}
frame(){const N=this.N,H=this.H,h=N/2,K=this.K,re=this.re,im=this.im,yr=this.yr,yi=this.yi,w=this.w,k=this.md=='karaoke';
for(let i=0;i<N;i++){const j=(this.rp+i)%N;re[i]=this.rl[j]*w[i];im[i]=this.rr[j]*w[i]}
this.fft(re,im,0);
const bw=sampleRate/N,b1=Math.max(2,Math.floor((k?110:170)/bw)),b2=Math.floor((k?12000:9500)/bw),hs=this.hist[this.hp],Lr=this.Lr,Li=this.Li,Rr=this.Rr,Ri=this.Ri,Cm=this.Cm,pw=k?1.2:6;let eM=0,eS=0;
for(let q=0;q<=h;q++){const q2=(N-q)&(N-1),zr=re[q],zi=im[q],cr=re[q2],ci=-im[q2];
const lr=(zr+cr)/2,li=(zi+ci)/2,rr=(zi-ci)/2,ri=-(zr-cr)/2;Lr[q]=lr;Li[q]=li;Rr[q]=rr;Ri[q]=ri;
const pl=lr*lr+li*li,pr=rr*rr+ri*ri,x=lr*rr+li*ri;let sim=2*x/(pl+pr+1e-12);if(sim<0)sim=0;if(sim>1)sim=1;
const c=Math.pow(sim,pw),mr=(lr+rr)/2,mi=(li+ri)/2;Cm[q]=c;hs[q]=Math.sqrt(mr*mr+mi*mi)*c;
const dr=(lr-rr)/2,di=(li-ri)/2;eM+=mr*mr+mi*mi;eS+=dr*dr+di*di}
this.eM+=eM;this.eS+=eS;if(++this.fc>=200){this.port.postMessage({mono:this.eS<this.eM*1e-4&&this.eM>1e-6});this.fc=0;this.eM=0;this.eS=0}
const tk=this.tk,tf=this.tf,ms=this.ms;
for(let q=0;q<=h;q++){
for(let j=0;j<K;j++)tk[j]=this.hist[j][q];const Hm=this.med(tk,K);
let n=0;for(let d=-6;d<=6;d++){let p=q+d;if(p<0)p=-p;if(p>h)p=2*h-p;tf[n++]=hs[p]}const Pm=this.med(tf,13);
let hm=Hm*Hm/(Hm*Hm+Pm*Pm+1e-18);
let bd=q<b1?Math.max(0,(q-b1*.6)/(b1*.4)):(q>b2?Math.max(0,1-(q-b2)/(b2*.3)):1);
let m=Cm[q]*(k?Math.max(hm,.08):hm*hm)*bd;if(k)m=Math.min(1,m*1.5);
const pv=ms[q];m=m>pv?m*.8+pv*.2:m*.5+pv*.5;ms[q]=m;
let ol_r,ol_i,or_r,or_i;
if(!k){const mr=(Lr[q]+Rr[q])/2*m,mi=(Li[q]+Ri[q])/2*m;ol_r=mr;ol_i=mi;or_r=mr;or_i=mi}
else{const g=1-.999*m;ol_r=Lr[q]*g;ol_i=Li[q]*g;or_r=Rr[q]*g;or_i=Ri[q]*g}
yr[q]=ol_r-or_i;yi[q]=ol_i+or_r;if(q>0&&q<h){yr[N-q]=ol_r+or_i;yi[N-q]=-ol_i+or_r}}
this.hp=(this.hp+1)%K;
this.fft(yr,yi,1);const sc=1/N/1.5;
for(let i=0;i<N;i++){this.ac[0][i]+=yr[i]*w[i]*sc;this.ac[1][i]+=yi[i]*w[i]*sc}
const M=this.fo[0].length-1;for(let i=0;i<H;i++){const p=(this.fw+i)&M;this.fo[0][p]=this.ac[0][i];this.fo[1][p]=this.ac[1][i]}this.fw=(this.fw+H)&M;
for(let c=0;c<2;c++){this.ac[c].copyWithin(0,H);this.ac[c].fill(0,N)}}
process(ins,outs){const a=ins[0],o=outs[0];if(!a||!a.length||!o.length)return true;const n=a[0].length,L=a[0],R=a[1]||a[0],N=this.N,H=this.H,M=this.fo[0].length-1;
for(let i=0;i<n;i++){this.rl[this.rp]=L[i];this.rr[this.rp]=R[i];this.rp=(this.rp+1)%N;
if(++this.cnt>=H){this.cnt=0;this.frame()}
o[0][i]=this.fo[0][this.fr];if(o[1])o[1][i]=this.fo[1][this.fr];this.fr=(this.fr+1)&M}return true}}
registerProcessor('wv-sep',S);
</script>
<script>try{const s=JSON.parse(localStorage.getItem("wave_set")||"{}"),r=document.documentElement,t=s.theme||"system";r.dataset.mo=s.mo||"waves";r.dataset.fx=s.fx===0?"off":"on";r.dataset.theme=t=="system"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):t;if(s.acc){r.style.setProperty("--ac",s.acc);const n=parseInt(s.acc.slice(1,7),16),f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};r.style.setProperty("--on",.2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)>.4?"#111":"#fff")}}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
#spl{position:fixed;inset:0;z-index:99999;background:#160C07;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;transition:opacity .5s ease,transform .5s ease,visibility 0s .5s;overflow:hidden}
#spl::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(75% 42% at 50% 38%,rgba(255,105,0,.30),transparent 70%),radial-gradient(100% 38% at 50% 108%,rgba(255,153,60,.22),transparent 70%);animation:splGlow 1.4s ease .05s backwards}
#spl .wv{position:absolute;left:0;bottom:0;width:200%;height:26%;z-index:-1;animation:splDrift 9s linear infinite;opacity:.9}
#spl .wv+.wv{height:20%;animation-duration:14s;animation-direction:reverse;opacity:.7}
#spl.out{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}
#spl .lg{position:relative;width:132px;height:132px;display:grid;place-items:center}
#spl .lg img{position:relative;width:132px;height:132px;border-radius:50%;box-shadow:0 14px 60px rgba(255,105,0,.5);animation:splIn .75s cubic-bezier(.2,.9,.3,1.25) .1s backwards}
#spl .lg i{position:absolute;inset:0;border-radius:50%;border:2px solid #ff8a2b;opacity:0;animation:splRing 1.8s ease-out .45s infinite}
#spl .lg i:nth-child(2){animation-delay:1.05s}
#spl b{font:600 30px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.32em;padding-left:.32em;background:linear-gradient(180deg,#fff 30%,#ffc999);-webkit-background-clip:text;background-clip:text;color:transparent;animation:splUp .7s ease .5s backwards}
#spl small{font:13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#c4a48c;letter-spacing:.08em;animation:splUp .7s ease .75s backwards}
#spl em{position:absolute;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));text-align:center;font:12px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-style:normal;color:#cdb09b;letter-spacing:.2em;animation:splUp .7s ease .95s backwards}
#spl em strong{color:#ff8a2b;font-weight:600}
#spl em i{display:block;margin-top:6px;font-style:normal;font-size:12px;letter-spacing:.2em;color:#cdb09b}
#spl em s{display:block;margin-top:10px;text-decoration:none;font-size:10px;letter-spacing:.14em;color:#6f5848}
@keyframes splIn{from{opacity:0;transform:scale(.55) rotate(-8deg)}}
@keyframes splUp{from{opacity:0;transform:translateY(12px)}}
@keyframes splRing{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
@keyframes splGlow{from{opacity:0}}
@keyframes splDrift{to{transform:translateX(-50%)}}
</style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}i{font-style:normal}
::placeholder{color:var(--sub)}
.hide{display:none!important}
.sub{color:var(--sub)}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:30px}
body.hasmini .app{padding-bottom:116px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:56px;padding:0 10px;background:var(--bg)}
.bar.sc{box-shadow:0 1px 0 var(--line)}
.bar>div{display:flex;align-items:center;gap:6px;height:56px}
.st{flex:1;min-width:0;font-size:20px;font-weight:700;opacity:0;transition:opacity .2s;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.sc .st{opacity:1}
.fl{flex:1}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;flex:none;position:relative}
.ib.on{color:var(--ac)}
.big{font-size:36px;font-weight:700;padding:6px 20px 12px;letter-spacing:-.5px;overflow-wrap:anywhere}
.big small{font-size:15px;color:var(--sub);font-weight:400;margin-left:8px}
.sb{margin:0 16px 10px;height:44px;border-radius:22px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--sub);border:1px solid var(--line)}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--tx)}
.lh{display:flex;align-items:center;gap:2px;padding:2px 12px 8px}
.lh .ib{width:38px;height:38px}
.lh .pb{height:36px;padding:0 16px;font-size:14px;margin-right:4px}
.pb{display:flex;align-items:center;gap:6px;background:var(--ac);color:var(--on);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px}
.pb.o{background:transparent;color:var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac)}
.rw{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 18px;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.v-list .rw{content-visibility:auto;contain-intrinsic-size:auto 72px}
.rw.sel{background:var(--act)}
.th{border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;flex:none;background-size:cover;background-position:center;overflow:hidden}
.th.sq{width:54px;height:54px}.th.wd{width:100px;height:56px;border-radius:10px}
.tx{flex:1;min-width:0}
.tx b,.tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx b{font-weight:500;font-size:16px}.tx small{color:var(--sub);font-size:13px;margin-top:2px}
.rw.cur .tx b{color:var(--ac)}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.playing .rw.cur .eq{display:flex}
.eq b{width:3px;background:var(--ac);animation:eq .8s infinite ease-in-out;border-radius:2px}
.eq b:nth-child(2){animation-delay:.2s}.eq b:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--sub);display:grid;place-items:center;flex:none;color:#fff;margin-left:-6px}
.rw.sel .ck{background:var(--ac);border-color:var(--ac)}
.gr{width:32px;height:42px;display:grid;place-items:center;color:var(--sub);touch-action:none;cursor:grab;flex:none}
.rw.ghost{box-shadow:0 14px 34px var(--sh);background:var(--card);border-radius:16px;transform:scale(1.03);opacity:.96}
.rw.drg{opacity:.3}
.rw.tgt{outline:2px solid var(--ac);outline-offset:-2px;border-radius:14px}
/* view modes */
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 16px}

/* ---------- typography: Google Files / Material 3 type scale ---------- */
html,body{font-family:"Google Sans Text","Google Sans",Roboto,"Wave Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:inherit}
:root[data-theme]{--sub:color-mix(in srgb,var(--tx) 72%,var(--bg))}
.sph b,.st{font-size:22px;line-height:28px;font-weight:400;letter-spacing:0}
.big{font-size:32px;line-height:40px;font-weight:400;letter-spacing:0}
.big small{font-size:16px;font-weight:400}
.tx b,.tile b,.srow b,.pc b{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
.tx small,.tile small,.srow small,.pc small{font-size:14px;line-height:20px;letter-spacing:.25px;margin-top:0}
.sech,.sec h4,dialog h4{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--sub)}
.aip{font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--sub)}
.opt{font-weight:500;letter-spacing:.15px}
.ttl .tx b{font-size:22px;line-height:28px;font-weight:500;letter-spacing:0}.ttl .tx small{font-size:16px;line-height:24px}
.dh b{font-size:22px;font-weight:500}
.empty h3{font-size:22px;font-weight:400}
.empty p{font-size:14px;line-height:20px;letter-spacing:.25px}
.sb{height:56px;border-radius:28px;border:0;background:color-mix(in srgb,var(--tx) 7%,var(--bg))}
.sb input{font-size:16px}

/* ---------- bottom sheet (menus) ---------- */
dialog.bs{position:fixed;inset:auto 0 0 0;width:100%;max-width:640px;height:auto;max-height:min(90%,720px);margin:0 auto;padding:0 0 calc(12px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:var(--card);overflow-y:auto;overscroll-behavior:contain;box-shadow:0 -1px 3px rgba(0,0,0,.2)}
dialog.bs[open]{animation:bsIn .3s var(--ease)}
@keyframes bsIn{from{transform:translateY(100%)}}
.bsh{display:flex;justify-content:center;padding:16px 0 12px;cursor:grab;touch-action:none}
.bsh i{display:block;width:32px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--tx) 38%,transparent)}
.bst{display:flex;align-items:center;gap:8px;padding:0 24px 12px}
.bst .ib{margin-left:-12px}
.bst b{flex:1;min-width:0;font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs .wb h4,.bs .wb .sech{margin:0;padding:16px 24px 8px}
.bs .wb>.row{display:flex;align-items:center;gap:16px;min-height:56px;margin:0;padding:0 24px;border-radius:0;font-size:16px;line-height:24px;letter-spacing:.15px}
.bs .wb>.row i{display:grid;place-items:center;width:24px;flex:none;color:var(--sub)}
.bs .wb>.row.red,.bs .wb>.row.red i{color:#e5484d}
.bs .wb>.row.cur{background:var(--act);font-weight:500}
.bs .wb>.row .ck2{margin-left:auto;display:grid;color:var(--ac)}
.bs .fmh{padding:0 24px 12px;margin:0 0 4px}
.bs .spg{padding:4px 24px 12px}
.bs .aip{padding:0 24px 8px}

/* ---------- form dialog (rename / new playlist) ---------- */
.alb input[type=text]{display:block;width:100%;height:56px;margin:20px 0 0;padding:0 16px;border-radius:4px;border:1px solid var(--ol);background:transparent;color:var(--tx);font-size:16px;letter-spacing:.5px}
.alb input[type=text]:focus{outline:0;border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.alb h4{display:none}
@media(prefers-reduced-motion:reduce){#toast,.drw,#full,#vp,#pgp,#setp{transition-duration:.01s!important}dialog[open],.pgin{animation-duration:.01s!important}}

/* ===================================================================
   Google Files player layer (v33): mini player, now playing, video player,
   menus and dialogs. Flat Material 3 surfaces, no decorative motion.
   Only the look and the touch behaviour change; every feature stays.
   =================================================================== */
/* flat: no motion-style overlay on player surfaces, menus or dialogs */
#mini::before,#mini::after,.pp::before,.pp::after,.rb::before,.rb::after,
dialog .row::before,dialog .row::after,dialog .spc::before,dialog .spc::after,dialog .opt::before,dialog .opt::after,
dialog .chip::before,dialog .chip::after,dialog .pb::before,dialog .pb::after,
#full .chip::before,#full .chip::after,#vp .vqr::before,#vp .vqr::after{display:none!important}
.pp,.playing .pp{box-shadow:none!important;animation:none!important}

/* ---- mini player: tonal card, square art, no spinning ---- */
#mini{left:8px;right:8px;gap:2px;padding:8px 4px 8px 8px;border:0;border-radius:16px;background:color-mix(in srgb,var(--tx) 8%,var(--card));box-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15)}
#md,.playing #md{width:48px;height:48px;border-radius:8px;border:0;animation:none;flex:none}
#mini .tx{padding:0 4px 0 8px}
#mini .tx b{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
#mini .tx small{font-size:14px;line-height:20px;letter-spacing:.25px}
#mini .rb,#mini .rb svg.rg{width:48px;height:48px}
.rb circle{stroke-width:2.5}

/* ---- now playing ---- */
#full{background:var(--bg);padding:env(safe-area-inset-top,0px) 0 calc(24px + env(safe-area-inset-bottom,0px))}
.ft{max-width:560px;height:64px;padding:0 4px;gap:4px;justify-content:flex-start;color:var(--tx)}
.ft>span{flex:1;min-width:0;padding-left:8px;text-align:left;font-size:22px;line-height:28px;font-weight:400;letter-spacing:0;color:var(--tx)}
.ft .ib{color:var(--tx)}
.stage{margin:12px 0 20px}
.fw{max-width:560px;padding:0 24px}
.ttl{margin-top:0}
.ttl .tx b{font-size:24px;line-height:32px;font-weight:400;letter-spacing:0}
.ttl .tx small{font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--sub)}
#fsk{margin-top:12px}
input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to right,var(--ac) var(--p,0%),color-mix(in srgb,var(--ac) 24%,var(--bg)) var(--p,0%))}
input[type=range]::-moz-range-track{background:color-mix(in srgb,var(--ac) 24%,var(--bg))}
.ftm{font-size:12px;line-height:16px;letter-spacing:.5px;color:var(--sub);margin-top:-2px}
.fc{margin:16px 0 16px}
.fc .ib.on{background:var(--act);color:var(--ac)}
.pp{width:72px;height:72px;border-radius:50%}
.fe{gap:8px;flex-wrap:wrap;row-gap:12px}
.fe .chip{margin-left:0!important}
#fvol{max-width:150px}
#fvb{width:40px;height:40px;color:var(--sub)}

/* ---- menus and dialogs: flat rows, M3 popup menu for the top-bar overflow ---- */
dialog.bs .row.cur{background:var(--act)}
.spc{height:40px;padding:0;font-size:14px;letter-spacing:.1px}
dialog.bs.pm{inset:calc(56px + env(safe-area-inset-top,0px)) 8px auto auto;width:min(280px,calc(100vw - 16px));min-width:200px;max-width:none;height:auto;max-height:calc(100% - 96px);margin:0;padding:8px 0;border-radius:4px;background:color-mix(in srgb,var(--tx) 5%,var(--card));box-shadow:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15)}
dialog.bs.pm[open]{animation:pmIn .15s var(--ease);transform-origin:100% 0}
@keyframes pmIn{from{opacity:0;transform:scale(.88)}}
dialog.pm::backdrop{background:transparent}
dialog.pm .bsh,dialog.pm .bst,dialog.pm .fmh{display:none}
dialog.bs.pm .wb>.row{min-height:48px;padding:0 12px;gap:12px}
/* snackbar sits at the bottom of whichever player is open */
body:has(#full.open) #toast,body:has(#vp.open) #toast{bottom:calc(16px + env(safe-area-inset-bottom,0px))}

/* ---- video player: black, M3 overlay controls ---- */
#vp{--bg:#000;--card:#1d1b20;--tx:#e6e1e5;--sub:#b4b0b8;--line:#3b383e;--ol:#8f8c93;--act:color-mix(in srgb,var(--ac) 26%,transparent);color-scheme:dark;background:#000}
.vtop{padding:4px 4px 28px}
#vp .vpc .vq{border-radius:4px;background:rgba(255,255,255,.16);padding:2px 8px;font:500 12px/16px system-ui,sans-serif;letter-spacing:.5px;margin-right:4px}
.vmid #vpp{background:rgba(0,0,0,.4);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.vsr>span,.vsr>button{font:500 12px/16px system-ui,sans-serif;letter-spacing:.5px}
.vsb .vth{width:12px;height:12px;margin:-6px 0 0 -6px;box-shadow:none}
.vsb.on .vth{transform:scale(1.67)}
.vsb .vbub{border-radius:4px;background:#322f35;font:500 12px/16px system-ui,sans-serif;padding:4px 8px;letter-spacing:.5px}
.vpc .vrow .vchp{height:32px;padding:0 12px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,.5);font:500 14px/20px system-ui,sans-serif;letter-spacing:.1px}
.vrs{border-radius:4px;background:#322f35;padding:0 8px 0 16px;min-height:48px;gap:8px;font-size:14px;line-height:20px;letter-spacing:.25px;box-shadow:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px rgba(0,0,0,.14),0 1px 18px rgba(0,0,0,.12)}
.vrs button{height:40px;padding:0 12px;border-radius:20px;color:color-mix(in srgb,var(--ac) 55%,#fff);font-size:14px;font-weight:500;letter-spacing:.1px}
.vhud{border-radius:12px;background:rgba(32,31,35,.92)}
.vi1{padding:0 16px}
.vi1 h2{font-size:22px;line-height:28px;font-weight:400;letter-spacing:0}
.vi1 p{font-size:14px;line-height:20px;letter-spacing:.25px;margin-top:2px}
.vact{gap:8px;padding:16px 16px 8px}
.vact button{flex-direction:row;min-width:0;height:32px;padding:0 12px 0 8px;gap:8px;border-radius:8px;background:transparent;border:1px solid var(--ol);color:var(--tx);font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.vact button svg{width:18px;height:18px}
.vact button.on{background:var(--act);border-color:transparent;color:var(--tx)}
.vact button.on svg{color:var(--ac)}
#vqh{margin:16px 16px 4px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;color:var(--sub)}
.vqr{padding:8px 16px;gap:16px}
.vqr.cur{background:var(--act)}
.vqr .tx small{font-size:14px;line-height:20px}

/* ---- video view modes (YouTube style): default, theater, miniplayer, full screen ---- */
#vp.th:not(.fs):not(.mn) .vpl{aspect-ratio:auto;height:72vh;height:72dvh;max-height:none}
.vmc{display:none}
#vp.mn{inset:auto 12px calc(92px + env(safe-area-inset-bottom,0px)) auto;width:min(62vw,280px);height:auto;border-radius:12px;overflow:hidden;transform:none;box-shadow:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3)}
#vp.mn:not(.open){visibility:hidden;transform:translateY(120%)}
#vp.mn:not(.fs) .vpl{min-height:0;max-height:none;padding-top:0;touch-action:auto}
#vp.mn .vpz{inset:0}
#vp.mn .vpi,#vp.mn .vpc,#vp.mn .vul,#vp.mn .vhud,#vp.mn .vrs{display:none}
#vp.mn .vsub{font-size:11px;line-height:1.3;bottom:6px}
#vp.mn .vmc{display:flex;position:absolute;inset:0;z-index:9;align-items:center;justify-content:center;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;transition:opacity .2s}
#vp.mn .vmc.on{opacity:1;pointer-events:auto}
.vmc button{position:absolute;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff}
.vmc #vmx{left:4px;top:4px}.vmc #vmcl{right:4px;top:4px}
.vmc #vmpp{position:static;width:48px;height:48px;background:rgba(0,0,0,.45)}
</style>
</head>

let lastSync=0,syncing=false;
async function autoSync(askNow){
 if(!savedDir||syncing||Date.now()-lastSync<30000&&!askNow)return;
 try{
  const st=savedDir.queryPermission?await savedDir.queryPermission({mode:"read"}):"granted";
  if(st!="granted"){
   if(!askNow)return armSync();
   if((await savedDir.requestPermission({mode:"read"}))!="granted")return;
  }
  syncing=true;lastSync=Date.now();await importDir(savedDir,true);
 }catch(e){}finally{syncing=false}
}

let trash=[];const DAY=864e5,KEEP=30*DAY;

function removeTracks(ids){
 const now=Date.now();
 ids.forEach(id=>{const t=tracks.find(x=>x.id==id);if(!t)return;t.trashed=now;t.fromPl=pls.filter(p=>p.ids.includes(id)).map(p=>p.id);trash.push(t);put(t)});

 if(cur&&ids.includes(cur.id)){v.pause();v.removeAttribute("src");cur=null;closeTo("full");closeTo("vp");ui()}
 toast(ids.length==1?"Moved to Trash. Kept for 30 days.":ids.length+" items moved to Trash. Kept for 30 days.");
}
function restoreT(ids){
 ids.forEach(id=>{const t=trash.find(x=>x.id==id);if(!t)return;(t.fromPl||[]).forEach(pid=>{const p=pls.find(x=>x.id==pid);if(p&&!p.ids.includes(id))p.ids.push(id)});delete t.trashed;delete t.fromPl;tracks.push(t);put(t)});

}
function purgeT(ids){try{const g=trash.filter(x=>ids.includes(x.id)&&x.nid).map(x=>x.nid);if(g.length){const o=JSON.parse(localStorage.getItem('wave_ign')||'[]');localStorage.setItem('wave_ign',JSON.stringify(o.concat(g)))}}catch(e){}ids.forEach(del);trash=trash.filter(x=>!ids.includes(x.id));trashN()}

document.addEventListener("visibilitychange",()=>{if(!document.hidden)purgeOld()});
function trashPage(){
 const y=$("pgp").scrollTop,now=Date.now(),items=[...trash].sort((a,b)=>b.trashed-a.trashed);
 const left=t=>{const d=Math.max(0,Math.ceil((t.trashed+KEEP-now)/DAY));return d==1?"1 day left":d+" days left"};
 let h='<div class="aip" style="padding-top:2px"><span>Deleted Audio and videos stay here for 30 days, then they are removed for good. Restore them any time before that, or delete them forever now.</span></div>';
 if(!items.length)h+='<div class="empty"><h3>Trash is empty</h3>Nothing to restore.</div>';
 else h+='<div class="trb"><button class="pb o" data-tr="rall">Restore all</button><button class="pb o red" data-tr="eall" style="color:#e5484d;box-shadow:inset 0 0 0 1px #e5484d">Empty trash</button></div>'
  +items.map(t=>'<div class="trr" data-id="'+t.id+'">'+thumb(t,"")+'<div class="tx"><b>'+esc(t.name)+'</b><small class="sub">'+(t.type=="video"?"Video":"Audio")+' · '+left(t)+'</small></div><button class="ib" data-tr="r" aria-label="Restore">'+ic("undo",22)+'</button><button class="ib red" data-tr="d" aria-label="Delete forever">'+ic("trash",22)+'</button></div>').join("");
 openPage("Trash",h,null);$("pgp").scrollTop=y;
 $("pgb").onclick=e=>{
  const b=e.target.closest("[data-tr]");if(!b)return;const k=b.dataset.tr,row=b.closest(".trr"),id=row&&row.dataset.id,t=id&&trash.find(x=>x.id==id);
  if(k=="r"&&t){restoreT([id]);toast("Restored")}
  else if(k=="d"&&t){askC("Delete forever?","\u201c"+esc(t.name)+"\u201d will be removed for good. This cannot be undone.","Delete forever",1).then(ok=>{if(ok){purgeT([id]);trashPage()}});return}
  else if(k=="rall"){restoreT(trash.map(x=>x.id));toast("Everything restored")}
  else if(k=="eall"){askC("Empty Trash?","All "+trash.length+" items in Trash will be removed for good. This cannot be undone.","Empty Trash",1).then(ok=>{if(ok){purgeT(trash.map(x=>x.id));trashPage()}});return}
  else return;
  trashPage();
 };
}

async function makeBackup(){
  const all=tracks.concat(trash);
  if(!all.length&&!pls.length)return toast("Nothing to back up yet");
  toast("Preparing backup\u2026");
  try{
    const parts=[],metas=[];
    for(const t of all){
      const m={};for(const k in t)if(k!="blob")m[k]=t[k];
      const b=t.blob;
      if(b&&b.size){m.__bs=b.size;m.__bt=b.type||"";m.__bn=b.name||"";parts.push(b)}else m.__bs=0;
      metas.push(m);
    }
    let last=null;try{last=localStorage.getItem("wave_last")}catch(e){}
    const man={app:"wave",v:1,date:Date.now(),pls:pls,set:set,last:last,av:avatar?{f:avatar,t:avthumb}:null,tracks:metas};
    const mb=new TextEncoder().encode(JSON.stringify(man)),hd=new Uint8Array(12);
    hd.set(new TextEncoder().encode(BK_MAGIC),0);new DataView(hd.buffer).setUint32(8,mb.length);
    const blob=new Blob([hd,mb].concat(parts),{type:"application/octet-stream"});
    const d=new Date(),p=n=>String(n).padStart(2,"0"),name="wave-backup-"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+".wavebackup";
    const u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),120000);
    try{localStorage.setItem("wave_bk",String(Date.now()))}catch(e){}
    drawSet();if($("pgt").textContent=="Backup & restore")backupPage();
    toast("Backup saved: "+name);
  }catch(e){toast("Could not create the backup. Free some space and try again.")}
}
async function restoreBackup(f){
  try{
    const dec=new TextDecoder();
    if(f.size<12||dec.decode(await f.slice(0,8).arrayBuffer())!=BK_MAGIC)return toast("This is not a Wave backup file");
    const ml=new DataView(await f.slice(8,12).arrayBuffer()).getUint32(0);
    const man=JSON.parse(dec.decode(await f.slice(12,12+ml).arrayBuffer()));
    if(!man||man.app!="wave"||!Array.isArray(man.tracks))return toast("This is not a Wave backup file");
    const when=man.date?new Date(man.date).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"";
    if(!(await askC("Restore backup"+(when?" from "+when:"")+"?",man.tracks.length+" items and "+(man.pls||[]).length+" playlists will be added.\nNothing you already have is deleted.","Restore")))return;
    if(!(await open))return toast("This browser cannot store the library");
    const have=new Set(tracks.concat(trash).map(x=>x.id));
    let off=12+ml,added=0,failed=0;
    for(let i=0;i<man.tracks.length;i++){
      const m=man.tracks[i],sz=m.__bs||0,start=off;off+=sz;
      if(have.has(m.id))continue;
      const t={};for(const k in m)if(k.slice(0,2)!="__")t[k]=m[k];
      if(sz){const sl=f.slice(start,start+sz,m.__bt||"");t.blob=m.__bn?new File([sl],m.__bn,{type:m.__bt||""}):sl}
      const ok=await put(t);
      if(ok==null){failed++;if(failed>=3){toast("Stopped: the device ran out of space");break}continue}
      added++;toast("Restoring "+(i+1)+" of "+man.tracks.length+"\u2026");
    }
    (man.pls||[]).forEach(p=>{const e=pls.find(x=>x.id==p.id);if(!e)pls.push(p);else p.ids.forEach(id=>{if(!e.ids.includes(id))e.ids.push(id)})});
    savePl();
    if(man.set&&typeof man.set=="object"){Object.assign(set,man.set);saveSet();try{applyTheme();applyViz();sndApply()}catch(e){}}
    if(man.av&&man.av.f){avatar=man.av.f;avthumb=man.av.t;await avSave();renderAv()}
    const a=await dbx("readonly",s=>s.getAll());
    if(a){const all=a.map(t=>(t.ord==null&&(t.ord=t.added),t));trash=all.filter(t=>t.trashed);tracks=all.filter(t=>!t.trashed).sort((x,y)=>x.added-y.added)}
    trashN();render();drawSet();
    if($("pgt").textContent=="Backup & restore")backupPage();
    toast(failed?"Restored "+added+" items, "+failed+" could not be saved":"Restored. "+added+" new items added");
  }catch(e){toast("Could not read that backup file")}
}

/* gestures: tap, double tap, swipe, hold, pinch */
(function(){
 const SK=10;let ptr=new Map(),g=null,lt=0,ls=-2,multi=0,tapT=0,lpT=0,hold=0,acc=0,hid=0,inB=0,wantT=0,sk=0,pend=0,tgt=0;

 const zone=x=>{const p=x/W();return p<.35?-1:p>.65?1:0};
 const mk=c=>{const e=document.createElement("div");e.className="dtk "+c;e.innerHTML='<span class="rp"></span><div class="pl"><svg viewBox="0 0 34 22"><path d="M5 3l8 8-8 8"/><path d="M15 3l8 8-8 8"/><path d="M25 3l8 8-8 8"/></svg><b></b></div>';vpl.appendChild(e);return e};
 const PD={"-1":mk("l"),"1":mk("r")};
 const seekTo=t=>{tgt=t;clearTimeout(sk);sk=setTimeout(()=>{if(v.seeking){pend=1;return}pend=0;try{v.currentTime=tgt}catch(e){}},140)};
 v.addEventListener("seeked",()=>{if(pend){pend=0;try{v.currentTime=tgt}catch(e){}}});
 const anim=(el,k,o)=>{try{return el.animate(k,o)}catch(e){}};
 function jump(z,reset,x,y){
  const d=v.duration;if(reset||!inB){acc=0;wantT=v.currentTime}inB=1;acc+=SK;
  wantT=Math.max(0,d&&isFinite(d)?Math.min(wantT+z*SK,Math.max(0,d-.25)):wantT+z*SK);seekTo(wantT);
  const e=PD[z],o=PD[-z];o.classList.remove("on");e.classList.add("on");e.querySelector("b").textContent=acc+" seconds";
  const sz=Math.max(e.offsetWidth,e.offsetHeight)*1.6,rp=e.querySelector(".rp");
  rp.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+(x-e.offsetLeft-sz/2)+"px;top:"+(y-e.offsetTop-sz/2)+"px";
  anim(rp,[{transform:"scale(.1)",opacity:.55},{transform:"scale(1)",opacity:0}],{duration:560,easing:"cubic-bezier(.2,.7,.3,1)"});
  e.querySelectorAll("path").forEach((q,i)=>anim(q,[{opacity:.25},{opacity:1,offset:.45},{opacity:.25}],{duration:480,delay:(z>0?i:2-i)*90,easing:"ease-in-out"}));
  clearTimeout(hid);hid=setTimeout(()=>{e.classList.remove("on");inB=0;multi=0},800)}
 function tap(x,y){
  const now=Date.now(),z=zone(x);
  if(z&&multi&&z==ls&&now-lt<800){lt=now;jump(z,0,x,y);return}
  if(z==ls&&now-lt<300){clearTimeout(tapT);lt=now;if(z){multi=1;jump(z,1,x,y)}else{toggle();vpShow(1)}return}
  lt=now;ls=z;multi=0;clearTimeout(tapT);tapT=setTimeout(()=>{if(VPS.lock)vulShow();else vpShow(-1)},260)}
 const endHold=()=>{if(hold){hold=0;v.playbackRate=rate;vhudOff(200)}};
 vpl.addEventListener("pointerdown",e=>{
  if(e.target.closest("button,.vsb,.vrs"))return;
  if(VPS.lock){vulShow();return}
  const l=loc(e);ptr.set(e.pointerId,l);try{vpl.setPointerCapture(e.pointerId)}catch(x){}
  if(ptr.size==2){clearTimeout(lpT);endHold();const a=[...ptr.values()];g={m:"pinch",d0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,z0:VPS.z};return}
  if(ptr.size>2)return;
  g={m:"",x0:l.x,y0:l.y,side:zone(l.x),moved:0,st:v.currentTime,br0:VPS.br,vo0:v.volume,px0:VPS.px,py0:VPS.py};
  clearTimeout(lpT);lpT=setTimeout(()=>{if(g&&!g.moved&&!g.m&&!v.paused&&!VPS.lock){hold=1;v.playbackRate=2;vhud('<b class="vbig">2x</b><span>Fast playback</span>')}},450);
 });
 vpl.addEventListener("pointermove",e=>{
  if(!g||!ptr.has(e.pointerId))return;const l=loc(e);ptr.set(e.pointerId,l);
  if(g.m=="pinch"){if(ptr.size<2)return;const a=[...ptr.values()];vpZoom(g.z0*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/g.d0);return}

   if(Math.abs(dx)<12&&Math.abs(dy)<12)return;g.moved=1;clearTimeout(lpT);if(hold)return;
   g.m=VPS.z>1?"pan":Math.abs(dx)>Math.abs(dy)?"seek":g.side<0?"bri":g.side>0?"vol":"none";

   const d=v.duration,t=Math.max(0,Math.min(d,g.st+dx/W()*Math.min(d,240))),df=Math.round(t-g.st);

  else if(g.m=="bri"){VPS.br=Math.max(.08,Math.min(1,g.br0-dy/(H()*.75)));$("vbr").style.opacity=(1-VPS.br).toFixed(2);vhud(pctBar("sun",VPS.br))}
  else if(g.m=="vol"){const x=Math.max(0,Math.min(1,g.vo0-dy/(H()*.75)));v.volume=x;const f=$("fvol");f.value=x;f.style.setProperty("--p",x*100+"%");vhud(pctBar(x?"vol":"mute",x))}

 });
